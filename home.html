    使用提示：<br data-page-node-id="uCDS9aE4YndX8IcJGns5uv">
    1. 「老师端」用<b>微信扫码登录</b>（在微信里打开会直接一键登录），登录后建班或输入绑定码加入，建班自动配好放学提醒与眼保健操；<br data-page-node-id="RCwqVaBnz9qsjRSXRsQxZx">

    4. 手机和教室电脑通过云端同步，不在同一网络也可以；定时通知（放学、眼保健操）到点自动弹发；<br data-page-node-id="caBNv4mLmdPbq1Hyk4DR6L">
    5. 录好花名册后，学生可在「学生收到页」或大屏点自己的名字确认收到，老师在记录里看未收到名单。
