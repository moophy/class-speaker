<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>班级小喇叭 · 入口</title>
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%;margin:0}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Microsoft YaHei",sans-serif;
    background:radial-gradient(900px 620px at 50% 12%,#12402F 0%,#0A1712 62%,#070D0B 100%);
    color:#EAF3EF;display:flex;align-items:center;justify-content:center;padding:22px;
  }
  .box{width:min(430px,100%);text-align:center}
  .logo{
    width:74px;height:74px;border-radius:22px;margin:0 auto 16px;
    background:linear-gradient(135deg,#00D68A,#00A76A);
    display:flex;align-items:center;justify-content:center;
    font-size:34px;font-weight:800;color:#fff;
    box-shadow:0 16px 40px rgba(0,199,126,.35),inset 0 1px 0 rgba(255,255,255,.35);
  }
  h1{font-size:25px;margin:0 0 6px;letter-spacing:-.4px}
  .sub{color:#8FA9A0;font-size:13.5px;margin:0 0 26px;line-height:1.7}
  .go{
    display:flex;align-items:center;justify-content:center;gap:8px;
    width:100%;padding:16px;border:none;border-radius:15px;cursor:pointer;
    background:linear-gradient(135deg,#00D68A,#00A76A);color:#04120C;
    font-size:16.5px;font-weight:800;letter-spacing:.2px;
    box-shadow:0 14px 34px rgba(0,199,126,.3);
  }
  .go:active{transform:translateY(1px)}
  .cnt{font-weight:600;opacity:.85}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
  .grid a{
    display:block;padding:14px 10px;border-radius:14px;text-decoration:none;
    background:rgba(255,255,255,.055);border:1px solid rgba(255,255,255,.09);
    color:#DCE9E4;font-size:13.5px;font-weight:600;
  }
  .grid a span{display:block;font-size:11px;font-weight:400;color:#7F998F;margin-top:3px}
  .tip{margin-top:20px;font-size:11.5px;color:#5D7269;line-height:1.75}
  .tip code{color:#7E988D;font-size:11px;word-break:break-all}
</style>
</head>
<body>
<div class="box">
  <div class="logo">喇</div>
  <h1>班级小喇叭</h1>
  <p class="sub">正在前往正式应用…<br>本页是 GitHub Pages 上的入口，实际应用运行在云端。</p>

  <button class="go" id="go">立即进入 <span class="cnt" id="cnt">3</span></button>

  <div class="grid">
    <a href="#" data-p="screen.html">教室大屏<span>投到班级电视</span></a>
    <a href="#" data-p="student.html">学生端<span>在教室里说话</span></a>
  </div>

  <p class="tip">
    如果一直停在本页，说明浏览器拦截了跳转，点上面的按钮即可。<br>
    入口地址：<code id="host">—</code>
  </p>
</div>
<script>
(function () {
  var BASE = 'https://class-speaker-00500.app.workbuddy.host/';
  var SHARE = 'JPUDPHCCPM';

  function qs() {
    var out = 'sharecode=' + SHARE;
    try {
      var p = new URLSearchParams(location.search);
      var code = (p.get('code') || p.get('classcode') || '').trim();
      if (/^\d{4,8}$/.test(code)) out += '&code=' + code;
    } catch (e) {}
    return out;
  }

  function url(page) {
    return BASE + (page || '') + '?' + qs();
  }

  var target = url('');
  try { document.getElementById('host').textContent = BASE.replace('https://', ''); } catch (e) {}

  var left = 3, timer = null, done = false;
  var cnt = document.getElementById('cnt');
  function jump() {
    if (done) return;
    done = true;
    location.replace(target);
  }
  document.getElementById('go').addEventListener('click', function (e) { e.preventDefault(); jump(); });

  Array.prototype.forEach.call(document.querySelectorAll('.grid a'), function (a) {
    a.setAttribute('href', url(a.getAttribute('data-p')));
  });

  timer = setInterval(function () {
    left -= 1;
    if (cnt) cnt.textContent = String(left > 0 ? left : 0);
    if (left <= 0) { clearInterval(timer); jump(); }
  }, 1000);
})();
</script>
</body>
</html>
