<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>班级小喇叭 · 收到</title>
<link rel="stylesheet" href="css/common.css">
<style>
  .st-big-btn { width: 100%; padding: 22px; font-size: 20px; border-radius: 18px; }
  .st-done {
    display: flex; flex-direction: column; align-items: center; gap: 10px;
    background: var(--green-light); border-radius: 18px; padding: 24px 16px; color: var(--green-deep);
  }
  .st-done .ic { width: 46px; height: 46px; }
  .st-done .t { font-size: 20px; font-weight: 800; }
  .st-done .s { font-size: 13px; color: var(--green-dark); opacity: .85; }
</style>
</head>
<body>
<div class="app">
  <div class="navbar light">
    <div class="logo" id="st-logo"></div>
    <div class="title">班级小喇叭 · 收到</div>
    <button class="nav-btn" id="st-switch" hidden>换人</button>
  </div>

  <!-- 还没有班级：输入绑定码 -->
  <div class="wrap" id="st-setup" hidden>
    <div class="card">
      <div class="card-label">输入老师给的 6 位绑定码</div>
      <div class="field"><input type="text" id="st-code" inputmode="numeric" maxlength="6" placeholder="000000" style="text-align:center;letter-spacing:8px;font-size:22px;font-weight:800"></div>
      <button class="btn block lg" id="st-join">进入</button>
      <p class="iframe-note mt12" style="margin-bottom:0">绑定码在老师端「班级」页顶部。绑定一次，之后打开就直接用。</p>
    </div>
  </div>

  <!-- 说明：一台设备代表全班，不选人 -->
  <div class="wrap" id="st-pick" hidden>
    <div class="card">
      <div class="card-label">班里一台设备就够了</div>
      <p class="iframe-note" style="margin-bottom:0">这台设备代表全班，收到通知点一下「收到了」就行，不用一个个点名字。</p>
    </div>
  </div>

  <!-- 主体：一个「收到了」按钮 -->
  <div class="wrap" id="st-main" hidden>
    <div class="card">
      <div class="row">
        <div class="avatar g" id="st-avatar">班</div>
        <div class="grow"><div style="font-weight:700" id="st-name"></div><div class="muted small" id="st-class"></div></div>
      </div>
    </div>

    <div class="card">
      <div class="card-label">最新通知 <span class="act" id="st-time"></span></div>
      <div id="st-latest"></div>
      <div id="st-action" class="mt16">
        <button class="btn st-big-btn" id="st-receipt">收到了</button>
      </div>
      <div class="center muted small mt8" id="st-hint"></div>
    </div>

    <div class="card center" id="st-timer-card" hidden>
      <div class="card-label" style="justify-content:center">课堂倒计时</div>
      <div class="countdown-chip" id="st-timer" style="font-size:30px">--:--</div>
    </div>
  </div>
</div>

<script src="js/config.js"></script>
<!-- 请求桥必须在云 SDK 之前加载 -->
<script src="js/bridge.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script>
<script src="js/common.js"></script>
<script src="js/cloud.js"></script>
<script src="js/student.js"></script>
</body>
</html>
