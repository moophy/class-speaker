<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>班级小喇叭 · 学生收到</title>
<link rel="stylesheet" href="css/common.css">
</head>
<body>
<div class="app">
  <div class="navbar light">
    <div class="logo" id="st-logo"></div>
    <div class="title">班级小喇叭 · 学生</div>
    <button class="nav-btn" id="st-switch">换人</button>
  </div>

  <div class="wrap" id="st-setup">
    <div class="card">
      <div class="card-label">选择班级</div>
      <div class="field"><input type="text" id="st-code" inputmode="numeric" placeholder="输入 6 位绑定码"></div>
      <button class="btn block" id="st-join">进入班级</button>
    </div>
  </div>

  <div class="wrap" id="st-main" hidden>
    <div class="card">
      <div class="row">
        <div class="avatar g" id="st-avatar">生</div>
        <div class="grow"><div style="font-weight:700" id="st-name"></div><div class="muted small" id="st-class"></div></div>
      </div>
    </div>
    <div class="card" id="st-latest-card">
      <div class="card-label">最新通知</div>
      <div id="st-latest"></div>
    </div>
    <div class="card">
      <div class="card-label">通知列表（点击可确认收到）</div>
      <div id="st-feed"></div>
    </div>
    <div class="card center" id="st-timer-card" hidden>
      <div class="card-label" style="justify-content:center">课堂倒计时</div>
      <div class="countdown-chip" id="st-timer" style="font-size:30px">--:--</div>
    </div>
  </div>

  <!-- 选择花名册弹层 -->
  <div class="overlay center" id="sheet-modal">
    <div class="sheet" style="width:100%">
      <div class="sheet-head"><div class="t" id="modal-title"></div><button class="close" data-close="sheet-modal">✕</button></div>
      <div id="modal-body"></div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/cloud.js"></script>
<script src="js/student.js"></script>
<script>/*桌面版专用*/if(location.protocol!=='file:'){document.addEventListener('DOMContentLoaded',function(){var d=document.createElement('div');d.style.cssText='position:fixed;inset:0;z-index:99999;background:#0A1712;color:#EAF3EF;font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center';d.innerHTML='<div style="max-width:430px"><div style="font-size:20px;font-weight:800;margin-bottom:10px">这是桌面版页面</div><p style="font-size:13.5px;line-height:1.85;color:#9FB5AB;margin:0 0 18px">教室大屏 / 学生端需要在电脑上作为软件运行。<br>请到下载页下载压缩包，解压后双击<br><b>start-screen.vbs</b> 或 <b>start-student.vbs</b>。</p><a href="../index.html" style="display:inline-block;padding:13px 22px;border-radius:12px;background:linear-gradient(135deg,#00D68A,#00A76A);color:#04120C;font-weight:800;text-decoration:none">去下载页</a></div>';document.body.appendChild(d);});}</script>
</body>
</html>
