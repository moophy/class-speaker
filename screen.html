<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>班级小喇叭 · 教室大屏</title>
<link rel="stylesheet" href="css/common.css">
<style>
  .feed-panel {
    position: fixed; top: 0; right: 0; bottom: 0; width: 380px; max-width: 86vw; z-index: 60;
    background: rgba(16, 22, 20, .96); border-left: 1px solid rgba(255,255,255,.1);
    padding: 18px; overflow-y: auto; display: none;
  }
  .feed-panel.show { display: block; }
  .feed-panel h3 { margin: 0 0 12px; font-size: 16px; color: #4BE39B; }
  .feed-item { border-bottom: 1px solid rgba(255,255,255,.08); padding: 12px 2px; font-size: 13px; color: rgba(255,255,255,.85); }
  .feed-item .muted2 { color: rgba(255,255,255,.4); font-size: 11.5px; margin-top: 4px; }
  .feed-item img { border-radius: 8px; margin-top: 6px; max-height: 110px; }
  .feed-item .play-btn { margin-top: 6px; }
  .screen-modal .sheet { background: #fff; color: var(--text); }
</style>
</head>
<body class="screen-body">
<div class="screen-wrap" id="screen-wrap">

  <!-- 顶层栏 -->
  <div class="screen-top">
    <span class="dot" id="s-live"></span>
    <span class="cls" id="s-cls" style="cursor:pointer" title="点击切换班级">未选择班级</span>
    <span class="tag-chip" id="s-code" hidden></span>
    <span class="spacer"></span>
    <span class="clock" id="s-clock">--:--</span>
    <button class="screen-btn" id="s-full">全屏</button>
    <button class="screen-btn" id="s-feed-btn">通知列表</button>
  </div>

  <!-- 待机层 -->
  <div class="big-clock" id="idle-layer">
    <div class="t" id="idle-time">--:--</div>
    <div class="d" id="idle-date"></div>
    <div class="cls" id="idle-cls"></div>
    <div class="mt16"><span class="countdown-chip" id="idle-next" hidden></span></div>
  </div>

  <!-- 倒计时层 -->
  <div class="panel-layer" id="timer-layer">
    <div class="panel-label" id="timer-label">倒计时</div>
    <div class="timer-digits" id="timer-digits">00:00</div>
  </div>

  <!-- 点名层 -->
  <div class="panel-layer" id="roll-layer">
    <div class="panel-label">课堂点名</div>
    <div class="roll-name" id="roll-name">--</div>
    <div class="roll-count" id="roll-count"></div>
    <div class="roll-hint">请被点到的同学起立 · 老师端可标记「到 / 缺勤」</div>
  </div>

  <!-- 通知层（最上层） -->
  <div class="notice-layer" id="notice-layer">
    <div class="notice-card">
      <div class="notice-head">
        <span class="tag-chip" id="n-tag">通知</span>
        <span class="who" id="n-who"></span>
      </div>
      <div class="notice-body" id="n-body"></div>
      <div class="notice-foot">
        <button class="btn ghost" id="n-close">关闭</button>
        <button class="btn" id="n-receipt">我收到了</button>
      </div>
    </div>
  </div>

  <!-- 通知列表侧栏 -->
  <div class="feed-panel" id="feed-panel">
    <h3>班级通知（可回放）</h3>
    <div id="feed-list"></div>
  </div>

  <!-- 收到·花名册弹层 -->
  <div class="overlay center screen-modal" id="receipt-overlay">
    <div class="sheet" style="width:100%">
      <div class="sheet-head"><div class="t">点击你的名字，确认收到</div><button class="close" id="receipt-close">✕</button></div>
      <div class="roster-grid" id="receipt-grid"></div>
    </div>
  </div>

  <!-- 声音解锁 -->
  <div class="unlock-layer" id="unlock-layer">
    <h1>班级小喇叭 · 教室大屏</h1>
    <p>点击下方按钮启用声音（朗读、对讲即时播放、倒计时提示音）。<br>本页面请保持常开，点「全屏」可投到大屏。</p>
    <button class="btn lg" id="unlock-btn">启用声音并开始</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@tencent-ai/workbuddy-cloud-sdk@dev/lib/index.global.js"></script>
<script src="js/config.js"></script>
<script src="js/common.js"></script>
<script src="js/cloud.js"></script>
<script src="js/screen.js"></script>
</body>
</html>
